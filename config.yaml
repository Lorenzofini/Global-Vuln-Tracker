# config.yaml (Versione 2.0 - Action-Based Topics)

settings:
  polling_interval_minutes: 2
  start_date: "2025-01-01"

  # --- NUOVA ARCHITETTURA: ACTION-BASED TOPICS ---
  # I topic sono ora basati su COSA FARE, non su chi è il vendor.
  # Questo elimina la necessità di configurare vendor e semplifica l'uso.
  topics:
    enabled: true

    # ID del GRUPPO Telegram con i Topics abilitati.
    main_chat_id: "-1003777333446"

    # NUOVA MODALITÀ: action_based
    # true = usa i 4 topic basati su azione (🔴 PATCH NOW, 🟠 PLAN THIS WEEK, etc.)
    # false = usa la vecchia logica vendor-based (deprecata)
    action_based: true

    # Mappa dei topic Action-Based
    # Questi topic dicono all'utente COSA FARE, non cosa è successo
    action_topics:
      # Azione immediata: exploit attivi, ransomware, CVSS 9+ con network attack
      patch_now: "🔴 PATCH NOW"

      # Da pianificare questa settimana: CVSS 7-8.9, vulnerabilità importanti
      plan_week: "🟠 PLAN THIS WEEK"

      # Monitorare: CVSS 4-6.9, rischio moderato
      monitor: "🟡 MONITOR"

      # News e articoli senza CVE specifico
      intel: "📰 INTEL BRIEFING"

      # Riepilogo settimanale automatico
      digest: "📊 Weekly Digest"

      # Threat intelligence: campagne ransomware, APT, trend
      threat_intel: "🎯 Threat Intel"

    # FALLBACK: Topic generale per edge cases
    general_topic_name: "Generale"

    # BANNER IMMAGINI (opzionale)
    # Abilita per inviare messaggi con immagine banner
    use_banners: false

    # URL delle immagini banner per ogni livello di severità
    # Puoi usare URL pubblici o caricare le tue immagini
    banners:
      critical: ""  # URL immagine per CRITICAL (rosso)
      high: ""      # URL immagine per HIGH (arancione)
      medium: ""    # URL immagine per MEDIUM (giallo)
      low: ""       # URL immagine per LOW (blu)
      intel: ""     # URL immagine per INTEL (news)

    # DEPRECATO: Manteniamo per retrocompatibilità ma non usato se action_based=true
    vendor_to_topic_name_map:
      microsoft: "Microsoft & Windows"
      windows: "Microsoft & Windows"

    severity_to_topic_name_map:
      critical: "🔥 CVE Critiche (9.0+)"
      high: "🔶 CVE Alte (7.0-8.9)"

  # Configurazione Weekly Digest
  digest:
    enabled: true
    # Giorno della settimana (0=lunedì, 6=domenica)
    day_of_week: 6
    # Ora di invio (formato 24h)
    hour: 10
    minute: 0

# Elenco delle fonti di vulnerabilità (questa parte rimane quasi invariata)
sources:
  - name: "RedHotCyber"
    type: "rss"
    enabled: true
    url: "https://www.redhotcyber.com/feed/"

  - name: "ACN (Agenzia per la Cybersicurezza Nazionale)"
    type: "rss"
    enabled: true
    url: "https://www.acn.gov.it/portale/feedrss/-/journal/rss/20119/723192"

  - name: "The Hacker News"
    type: "rss"
    enabled: true
    url: "https://feeds.feedburner.com/TheHackersNews"

  - name: "BleepingComputer"
    type: "rss"
    enabled: true
    url: "https://www.bleepingcomputer.com/feed/"

  - name: "US-CERT Alerts"
    type: "rss"
    enabled: true
    url: "https://www.cisa.gov/uscert/ncas/current-activity.xml"

  - name: "CERT-EU"
    type: "rss"
    enabled: true
    url: "https://cert.europa.eu/publications/security-advisories-rss"

  - name: "ExploitDB"
    type: "rss"
    enabled: true
    url: "https://www.exploit-db.com/rss.xml"

  - name: "CISA KEV (Known Exploited Vulnerabilities)"
    type: "cisa_kev"
    enabled: true
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

  - name: "NVD"
    type: "nvd"
    enabled: true

  - name: "OSV.dev Advisories" # Nome più generico e corretto
    type: "rss" # Trattiamolo come un RSS, è più stabile
    enabled: true # Abilitato perché è una fonte utile
    url: "https://github.com/github/advisory-database/commits/main.atom"

  - name: "GitHub Security Advisories"
    type: "github"
    enabled: true