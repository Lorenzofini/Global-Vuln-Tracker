# config.yaml (Versione aggiornata per Topics)

settings:
  # polling_interval_minutes: 15
  polling_interval_minutes: 2
  # start_date: "2025-01-01"
  start_date: "2025-01-01"

  # --- NUOVA SEZIONE PER I TOPICS ---
  # Questa sezione sostituisce la vecchia sezione 'filters'.
  topics:
    enabled: true
    
    # IMPORTANTE: Inserisci qui l'ID del tuo GRUPPO Telegram con i Topics abilitati.
    # Deve essere un numero negativo tra virgolette (es. "-1001234567890").
    main_chat_id: "-1003777333446" 

    # Nome del topic "Generale" dove finiscono le vulnerabilità non categorizzate.
    # Il bot lo creerà automaticamente se non esiste.
    general_topic_name: "Generale"

    # Mappa che associa un VENDOR (in minuscolo) al NOME del topic desiderato.
    # Puoi usare lo stesso nome di topic per raggruppare più vendor.
    vendor_to_topic_name_map:
      microsoft: "Microsoft & Windows"
      windows: "Microsoft & Windows"
      exchange: "Microsoft & Windows"
      azure: "Microsoft & Windows"

      vmware: "Virtualizzazione & Cloud"
      
      cisco: "Networking & Security"
      fortinet: "Networking & Security"
      juniper: "Networking & Security"
      
      apache: "Server & Servizi Web"
      nginx: "Server & Servizi Web"
      
      linux: "Linux & Open Source"
      kernel: "Linux & Open Source"
      openssl: "Linux & Open Source"
      php: "Linux & Open Source"
      
    # Mappa che associa la GRAVITÀ al NOME del topic desiderato.
    # Una CVE può finire in più topic (es. in "Microsoft" e in "Critiche").
    severity_to_topic_name_map:
      critical: "🔥 CVE Critiche (9.0+)"
      high: "🔶 CVE Alte (7.0-8.9)"
      # Puoi aggiungere 'medium' e 'low' se vuoi creare topic anche per quelle.

# Elenco delle fonti di vulnerabilità (questa parte rimane quasi invariata)
sources:
  - name: "RedHotCyber"
    type: "rss"
    enabled: true
    url: "https://www.redhotcyber.com/feed/"

  - name: "ACN (Agenzia per la Cybersicurezza Nazionale)"
    type: "rss"
    enabled: true
    url: "https://www.acn.gov.it/portale/feedrss/-/journal/rss/20119/723192"

  - name: "The Hacker News"
    type: "rss"
    enabled: true
    url: "https://feeds.feedburner.com/TheHackersNews"

  - name: "BleepingComputer"
    type: "rss"
    enabled: true
    url: "https://www.bleepingcomputer.com/feed/"

  - name: "US-CERT Alerts"
    type: "rss"
    enabled: true
    url: "https://www.cisa.gov/uscert/ncas/current-activity.xml"

  - name: "CERT-EU"
    type: "rss"
    enabled: true
    url: "https://cert.europa.eu/publications/security-advisories-rss"

  - name: "ExploitDB"
    type: "rss"
    enabled: true
    url: "https://www.exploit-db.com/rss.xml"

  - name: "CISA KEV (Known Exploited Vulnerabilities)"
    type: "cisa_kev"
    enabled: true
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

  - name: "NVD"
    type: "nvd"
    enabled: true

  - name: "OSV.dev Advisories" # Nome più generico e corretto
    type: "rss" # Trattiamolo come un RSS, è più stabile
    enabled: true # Abilitato perché è una fonte utile
    url: "https://github.com/github/advisory-database/commits/main.atom"

  - name: "GitHub Security Advisories"
    type: "github"
    enabled: true